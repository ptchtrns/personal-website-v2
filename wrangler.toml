name = "personal-website-v2"
main = "./server.js"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "personal-website-v2-db"
database_id = "32c54904-af01-4aae-aa0d-f6e1832de361"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "CDN"
bucket_name = "personal-website-v2-cdn"

# `lib/storage-local.ts` imports the `wrangler` package for local Deno dev
# only; swapped for a stub here so wrangler's own build doesn't try to bundle
# itself into the Worker (see `wrangler-stub.ts`).
[alias]
wrangler = "./wrangler-stub.ts"

# Secrets (ADMIN_PASSWORD, JWT_SECRET, RESEND_API_KEY) are provisioned once
# via `wrangler secret put <NAME>`, not stored here or in CI.
[vars]
CONTACT_TO_EMAIL = "ptchtrns@gmail.com"
JWT_EXPIRY_HOURS = "6"
PHOTO_BASE_URL = "https://cdn.ptchtrns.com"
